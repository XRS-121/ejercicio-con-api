<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - JSONPlaceholder</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Lista de Usuarios</h1>
        
        <!-- Contenedor donde se cargarán las tarjetas -->
        <div id="users-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Ventana Flotante (Modal) -->
    <div id="user-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-2xl relative">
            <h2 class="text-2xl font-bold mb-4 text-gray-800 border-b pb-2">Detalles del Usuario</h2>
            
            <div class="space-y-3 text-gray-700">
                <p><strong>ID:</strong> <span id="modal-id"></span></p>
                <p><strong>Nombre:</strong> <span id="modal-name"></span></p>
                <p><strong>Username:</strong> <span id="modal-username"></span></p>
                <p><strong>Email:</strong> <span id="modal-email"></span></p>
                <p><strong>Teléfono:</strong> <span id="modal-phone"></span></p>
                <p><strong>Sitio Web:</strong> <span id="modal-website"></span></p>
            </div>

            <button onclick="closeModal()" class="mt-6 w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">
                Cerrar
            </button>
        </div>
    </div>

    <!-- Lógica de JavaScript -->
    <script>
        async function cargarDatos() {
            try {
                // Hacemos el fetch al endpoint oficial
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                const users = await response.json();
                
                renderizarTarjetas(users);
            } catch (error) {
                console.error("Error al cargar los usuarios:", error);
            }
        }

        function renderizarTarjetas(users) {
            const container = document.getElementById('users-container');
            container.innerHTML = '';

            users.forEach(user => {
                // Creamos la tarjeta para cada usuario
                const card = document.createElement('div');
                // Añadimos clases de Tailwind y cursor-pointer para indicar que se puede hacer clic
                card.className = 'bg-white p-5 rounded-xl shadow cursor-pointer hover:shadow-lg hover:border-blue-500 border border-transparent transition-all';
                
                card.innerHTML = `
                    <h3 class="font-bold text-lg text-gray-800">${user.name}</h3>
                    <p class="text-gray-500 text-sm mb-2">@${user.username}</p>
                    <p class="text-gray-600 text-sm">📧 ${user.email}</p>
                `;

                // Evento de clic en la tarjeta para abrir la ventana flotante
                card.addEventListener('click', () => {
                    openModal(user);
                });

                container.appendChild(card);
            });
        }

        function openModal(user) {
            // Rellenamos los campos del modal con los datos exactos del usuario seleccionado
            document.getElementById('modal-id').textContent = user.id;
            document.getElementById('modal-name').textContent = user.name;
            document.getElementById('modal-username').textContent = user.username;
            document.getElementById('modal-email').textContent = user.email;
            document.getElementById('modal-phone').textContent = user.phone;
            document.getElementById('modal-website').textContent = user.website;

            // Mostramos la ventana flotante quitando la clase 'hidden'
            document.getElementById('user-modal').classList.remove('hidden');
        }

        function closeModal() {
            // Ocultamos la ventana flotante añadiendo la clase 'hidden'
            document.getElementById('user-modal').classList.add('hidden');
        }

        // Ejecutar al cargar la página
        window.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
